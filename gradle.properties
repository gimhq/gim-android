# D8 (dexing / mergeExtDex*) runs in-process in the Gradle daemon, one work item per worker, so heap demand grows
# with the worker count, which defaults to the CPU count. Uncapped on a 32-CPU host the cold androidTest build needs
# >3 GB live heap and OOMs in a 2 GB daemon; capped at 8 workers it peaks at ~1.9 GB, leaving 2x headroom in 4 GB.
# Budget: 4 GB Gradle + 2 GB Kotlin daemon, fits a 16 GB CI runner next to the emulator.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Hub URL prefilled in the onboarding server field (e.g. http://10.0.2.2:8080 for an emulator).
# Empty leaves the field blank. Override with -Pgim.defaultHubUrl=... or env GIM_DEFAULT_HUB_URL.
gim.defaultHubUrl=
