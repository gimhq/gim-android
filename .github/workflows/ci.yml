name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests, assemble
        run: ./gradlew lint testDebugUnitTest assembleDebug --no-daemon

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: "**/build/reports/**"

  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: 35
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.x"

      - name: Install gim-server dependencies
        working-directory: e2e/gim-server
        run: bun install --frozen-lockfile

      - name: Start gim-server
        working-directory: e2e/gim-server
        run: |
          mkdir -p "$RUNNER_TEMP/gim-server"
          PORT=8080 HOST=0.0.0.0 \
            DATABASE_PATH="$RUNNER_TEMP/gim-server/gim.db" DATA_DIR="$RUNNER_TEMP/gim-server" \
            nohup bun src/index.ts >"$RUNNER_TEMP/gim-server.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          echo "gim-server did not become healthy" >&2
          cat "$RUNNER_TEMP/gim-server.log" >&2
          exit 1

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64

      # Boot/infra retry: the snapshot step runs no tests, so retrying it can never mask a test failure.
      # Device tests below are never retried.
      - name: Create AVD snapshot
        id: avd-snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Create AVD snapshot (retry)
        if: steps.avd-snapshot.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.gimServerUrl=http://10.0.2.2:8080 --no-daemon

      - name: Upload device test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            ${{ runner.temp }}/gim-server.log
