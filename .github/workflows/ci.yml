name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint, unit tests, assemble
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease --no-daemon

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: "**/build/reports/**"

  device-tests:
    runs-on: ubuntu-latest
    # Non-blocking until device tests are green twice in a row on CI (M2.0 decision 3hw80l71); a follow-up task removes this key.
    continue-on-error: true
    timeout-minutes: 60
    env:
      API_LEVEL: 35
      # Same device as scripts/run-device-tests.sh; the runner's default AVD (320x640) lets the keyboard cover inputs.
      AVD_PROFILE: pixel_6
      AVD_DISK_SIZE: 4096M
      AVD_RAM_SIZE: 3072M
    steps:
      - uses: actions/checkout@v4

      # The default AVD userdata partition does not fit on a stock runner; drop toolchains this job never uses.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /
          echo "AVD_CORES=$(( $(nproc) < 4 ? $(nproc) : 4 ))" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # gim-hub at the commit pinned in e2e/GIM_HUB_VERSION, built with the hub's own Dockerfile (as
      # scripts/run-device-tests.sh does locally). A pinned commit fully determines the image, so the saved image
      # is cached by commit: a hit is a ~10 s `docker load`, a miss one Docker build. Faster on ubuntu-latest than
      # cargo + rust-cache, which would still need the hub's Rust toolchain and a large target dir on every run.
      - name: Read pinned gim-hub commit
        run: echo "GIM_HUB_SHA=$(tr -d '[:space:]' < e2e/GIM_HUB_VERSION)" >> "$GITHUB_ENV"

      - name: Restore gim-hub image
        id: hub-image
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gim-hub-image.tar
          key: gim-hub-image-${{ env.GIM_HUB_SHA }}

      - name: Check out gim-hub
        if: steps.hub-image.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: gimhq/gim-hub
          ref: ${{ env.GIM_HUB_SHA }}
          ssh-key: ${{ secrets.GIM_HUB_DEPLOY_KEY }}
          path: gim-hub-src
          persist-credentials: false

      # actions/checkout only writes under the workspace; move the hub out of the Gradle project right away.
      - name: Build gim-hub image
        if: steps.hub-image.outputs.cache-hit != 'true'
        run: |
          mv gim-hub-src "$RUNNER_TEMP/gim-hub"
          docker build --label "gim.hub.commit=$GIM_HUB_SHA" -t gim-hub:ci "$RUNNER_TEMP/gim-hub"
          docker save gim-hub:ci -o "$RUNNER_TEMP/gim-hub-image.tar"

      - name: Save gim-hub image
        if: steps.hub-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gim-hub-image.tar
          key: gim-hub-image-${{ env.GIM_HUB_SHA }}

      - name: Load gim-hub image
        if: steps.hub-image.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/gim-hub-image.tar"

      # Disposable hub: data in memory. Published on the runner's loopback, which the emulator reaches as 10.0.2.2.
      # gim-core signs in only at the URL the hub proves, so its public URL is the one the app uses.
      - name: Start gim-hub
        env:
          GIM_HUB_PUBLIC_URL: http://10.0.2.2:8080
        run: |
          rm -f "$RUNNER_TEMP/gim-hub-image.tar"
          docker run -d --name gim-hub -p 127.0.0.1:8080:8080 \
            --tmpfs /data:rw,uid=10001,gid=10001,mode=0700 \
            -e GIM_HUB_LISTEN=0.0.0.0:8080 -e GIM_HUB_DATA_DIR=/data -e GIM_HUB_PUBLIC_URL \
            gim-hub:ci
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/healthz && exit 0
            sleep 1
          done
          echo "gim-hub did not become healthy" >&2
          docker logs gim-hub >&2
          exit 1

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-${{ env.AVD_PROFILE }}-disk${{ env.AVD_DISK_SIZE }}-ram${{ env.AVD_RAM_SIZE }}-cores${{ env.AVD_CORES }}

      # Boot/infra retry: the snapshot step runs no tests, so retrying it can never mask a test failure.
      # Device tests below are never retried.
      - name: Create AVD snapshot
        id: avd-snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM_SIZE }}
          disk-size: ${{ env.AVD_DISK_SIZE }}
          emulator-boot-timeout: 300
          force-avd-creation: false
          emulator-options: -no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Create AVD snapshot (retry)
        if: steps.avd-snapshot.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM_SIZE }}
          disk-size: ${{ env.AVD_DISK_SIZE }}
          emulator-boot-timeout: 300
          force-avd-creation: false
          emulator-options: -no-metrics -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          target: google_apis
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM_SIZE }}
          disk-size: ${{ env.AVD_DISK_SIZE }}
          emulator-boot-timeout: 300
          force-avd-creation: false
          emulator-options: -no-metrics -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # boot_completed comes before Android has a default network (mirrors scripts/e2e-interop.sh). Waits in
          # the tests are doubled: the software-rendered emulator draws ~3 frames/s on these runners. On failure the
          # full device logcat (ANRs, system dialogs) is saved; the test's own logcat only covers its process.
          script: |
            adb logcat -G 16M
            adb shell 'for i in $(seq 1 90); do dumpsys connectivity | grep -qE "^Active default network: [0-9]+" && exit 0; sleep 1; done; echo "no default network after 90 s" >&2; exit 1'
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.gimServerUrl=http://10.0.2.2:8080 -Pandroid.testInstrumentationRunnerArguments.timeoutScale=2 --no-daemon || { mkdir -p "$RUNNER_TEMP/emulator-logs"; adb logcat -d > "$RUNNER_TEMP/emulator-logs/device-logcat.txt"; exit 1; }

      - name: Collect gim-hub log
        if: failure()
        run: docker logs gim-hub > "$RUNNER_TEMP/gim-hub.log" 2>&1 || true

      - name: Collect emulator diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/emulator-logs"
          df -h / > "$RUNNER_TEMP/emulator-logs/df.txt"
          cp -r /tmp/android-"$USER" "$RUNNER_TEMP/emulator-logs/tmp-android" 2>/dev/null || true
          find ~/.android/avd -maxdepth 2 \( -name '*.ini' -o -name '*.log' -o -name '*.txt' \) \
            -exec cp --parents {} "$RUNNER_TEMP/emulator-logs" \; 2>/dev/null || true

      - name: Upload device test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            ${{ runner.temp }}/gim-hub.log
            ${{ runner.temp }}/emulator-logs/**
